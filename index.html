<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a2bd4" id="themeColor">
<script>try{var m=new URLSearchParams(location.search).get("mode")||localStorage.getItem("ff_mode");document.documentElement.dataset.mode=(m==="mom")?"mom":"kid";}catch(e){document.documentElement.dataset.mode="kid";}</script>
<title>Food Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&family=Rubik:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#20174a; --violet:#4a2bd4; --lemon:#ffd93d; --bubblegum:#ff7bc5; --mint:#5df2b0; --sky:#6ed0ff; --orange:#ff8a3d;
    --soft:#5b5480;
    --display:"Lilita One","Rubik","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
    --body:"Nunito","Rubik","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  body {
    margin:0; min-height:100vh; display:flex; justify-content:center; padding:22px 14px 60px;
    font-family:var(--body); font-weight:700; color:var(--ink);
    background-color:var(--violet);
    background-image:radial-gradient(rgba(255,255,255,.14) 2.2px, transparent 2.4px);
    background-size:30px 30px;
  }
  :focus-visible { outline:4px solid var(--sky); outline-offset:3px; }
  .wrap { width:100%; max-width:640px; position:relative; z-index:1; }
  .wrap.wide { max-width:1100px; }

  /* static food doodles in the background */
  #decor { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  #decor span { position:absolute; opacity:.22; filter:saturate(1.2); }

  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .logo { margin:0; font-family:var(--display); font-weight:400; font-size:clamp(1.9rem, 7vw, 2.7rem); line-height:1;
    color:var(--lemon); -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink);
    transform:rotate(-2deg); display:flex; align-items:center; gap:8px; }
  .logo-emoji { -webkit-text-stroke:0; text-shadow:none; font-size:.95em; }
  .langpick select { font-family:var(--body); font-weight:800; font-size:1rem; color:var(--ink); background:#fff; border:3px solid var(--ink);
    border-radius:999px; padding:8px 14px; box-shadow:0 4px 0 var(--ink); cursor:pointer; }

  .userbar { display:flex; gap:8px; align-items:center; background:#fff; border:3px solid var(--ink); border-radius:999px;
    padding:6px 8px 6px 14px; margin-bottom:14px; box-shadow:0 4px 0 var(--ink); }
  .userbar #who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; font-size:.9rem; }

  .mascot { display:flex; align-items:flex-end; gap:10px; margin-bottom:16px; }
  .mascot-face { font-size:3.6rem; line-height:1; flex:none; }
  .mascot-face.wiggle { animation:wiggle .5s ease; }
  .bubble { position:relative; background:#fff; border:3px solid var(--ink); border-radius:20px; padding:12px 16px; line-height:1.35;
    box-shadow:0 5px 0 var(--ink); font-size:1.05rem; }
  .bubble::before { content:""; position:absolute; inset-inline-start:-11px; bottom:18px; width:18px; height:18px; background:#fff;
    border-inline-start:3px solid var(--ink); border-bottom:3px solid var(--ink); transform:rotate(45deg); }
  html[dir="rtl"] .bubble::before { transform:rotate(-135deg); }

  .card { background:#fff; border:4px solid var(--ink); border-radius:26px; padding:18px; margin-bottom:16px; box-shadow:0 8px 0 var(--ink); }
  .card.inner { box-shadow:none; border-width:3px; background:#faf7ff; border-radius:18px; }
  .clock { display:inline-block; background:var(--sky); border:3px solid var(--ink); border-radius:999px; padding:4px 12px; font-size:.9rem; margin-bottom:14px; }
  label.field { display:block; font-family:var(--display); font-weight:400; font-size:1.35rem; margin-bottom:10px; }
  h2, h3 { font-family:var(--display); font-weight:400; margin:0 0 10px; }

  input, textarea, select.plain { width:100%; font:inherit; font-weight:700; color:var(--ink); background:#fff6c9; border:3px solid var(--ink); border-radius:16px;
    padding:12px 14px; margin-bottom:10px; font-size:1.05rem; }
  textarea { min-height:84px; resize:vertical; }
  input::placeholder, textarea::placeholder { color:#8d86ad; }
  .card.inner input, .card.inner textarea, .card.inner select.plain { background:#fff; }

  /* buttons */
  button { font-family:var(--display); font-weight:400; color:var(--ink); cursor:pointer; }
  .btn { background:var(--lemon); border:3px solid var(--ink); border-radius:16px; padding:11px 18px; font-size:1.2rem; box-shadow:0 5px 0 var(--ink);
    transition:transform .08s, box-shadow .08s; }
  .btn:hover { filter:brightness(1.04); }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .btn:disabled { opacity:.7; cursor:wait; }
  .btn.big { width:100%; font-size:1.7rem; padding:15px; border-radius:20px; border-width:4px; box-shadow:0 7px 0 var(--ink); }
  .btn.big:active { transform:translateY(5px); box-shadow:0 2px 0 var(--ink); }
  .btn.white { background:#fff; }
  .btn.pink { background:var(--bubblegum); }
  .btn.danger { background:#ff6b6b; }
  .btn.small { padding:5px 12px; font-size:.95rem; border-radius:12px; box-shadow:0 3px 0 var(--ink); border-width:2.5px; }
  .btn.small:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .btn.on { background:var(--lemon); }
  .row { display:flex; gap:10px; }
  .row .btn { flex:1; }

  /* food chips */
  .chips-label { font-size:.9rem; color:var(--soft); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { font-family:var(--body); font-weight:800; font-size:1rem; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:6px 13px;
    box-shadow:0 3px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  .chip:nth-child(4n+1) { background:#ffe9a6; }
  .chip:nth-child(4n+2) { background:#ffc4e6; }
  .chip:nth-child(4n+3) { background:#b9f7da; }
  .chip:nth-child(4n+4) { background:#bfe8ff; }
  .chip:active { transform:translateY(3px); box-shadow:0 0 0 var(--ink); }
  .chip.pop { animation:pop .25s ease; }

  .notice { font-size:.85rem; line-height:1.4; margin:10px 0 0; color:var(--soft); }
  .error { color:#c62828; }
  .ok { color:#14804a; }
  .muted { color:var(--soft); }

  /* result: the bento lunchbox */
  #result { margin-top:6px; }
  .says { margin-bottom:12px; }
  .tray { background:var(--ink); border-radius:28px; padding:12px; display:grid; grid-template-columns:1fr; gap:12px; margin-top:6px; }
  .bento { position:relative; border-radius:20px; padding:16px 16px 14px; animation:drop .55s cubic-bezier(.2,1.4,.4,1) both; }
  .bento:nth-child(1) { background:var(--lemon); animation-delay:0s; }
  .bento:nth-child(2) { background:var(--bubblegum); animation-delay:.14s; }
  .bento:nth-child(3) { background:var(--mint); animation-delay:.28s; }
  .bento:nth-child(n+4) { background:var(--sky); }
  .bento .big-emoji { font-size:3.4rem; line-height:1; display:block; margin-bottom:6px; }
  .bento h3 { font-size:1.5rem; margin:0 0 6px; padding-inline-end:56px; line-height:1.1; }
  .bento p { margin:6px 0; line-height:1.4; font-size:1rem; }
  .bento .how b { display:block; font-family:var(--display); font-weight:400; font-size:1.05rem; }
  .price { position:absolute; top:-12px; inset-inline-end:-6px; min-width:58px; text-align:center; background:var(--orange); color:var(--ink); border:3px solid var(--ink);
    border-radius:999px; padding:6px 10px; font-family:var(--display); font-size:1.15rem; transform:rotate(8deg); box-shadow:0 3px 0 var(--ink); }
  @media (min-width:540px) {
    .tray { grid-template-columns:1fr 1fr; }
    .bento:nth-child(1) { grid-column:1 / -1; }
  }
  .thinking { background:var(--ink); color:#fff; border-radius:24px; padding:22px; text-align:center; font-family:var(--display); font-size:1.4rem; }
  .thinking .pan { display:block; font-size:3.2rem; animation:shake .6s ease-in-out infinite; }

  .confetti { position:fixed; top:-40px; pointer-events:none; z-index:50; animation:fall linear forwards; }

  /* banned */
  .sleepy { text-align:center; }
  .sleepy .zzz { font-size:4rem; display:block; margin-bottom:6px; }

  /* admin */
  #adminView .card { overflow:hidden; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; font-family:var(--body); }
  th, td { padding:8px; border-bottom:2px solid #e6e0ff; text-align:start; vertical-align:top; }
  th { background:#f1ecff; white-space:nowrap; }
  td pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-size:.78rem; color:var(--soft); }
  details summary { cursor:pointer; }
  .badge { display:inline-block; font-size:.75rem; border-radius:999px; padding:2px 9px; border:2px solid var(--ink); background:#fff; }
  .badge.override { background:var(--lemon); }
  .badge.banned { background:#ff9a9a; }
  .badge.active { background:var(--mint); }
  .sugg { border-top:2px dashed #cfc6f5; padding-top:10px; margin-top:6px; }

  @keyframes drop { from { opacity:0; transform:translateY(-34px) scale(.92) rotate(-3deg); } to { opacity:1; transform:none; } }
  @keyframes pop { 50% { transform:scale(1.18); } }
  @keyframes wiggle { 25% { transform:rotate(-12deg); } 75% { transform:rotate(12deg); } }
  @keyframes shake { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(8deg) translateY(-4px); } }
  @keyframes fall { to { transform:translateY(112vh) rotate(420deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }

  /* ===== mode switcher, effort picker, social buttons, result extras ===== */
  .modebar { display:flex; justify-content:center; margin:0 0 14px; }
  .seg { display:inline-flex; flex-wrap:wrap; gap:4px; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:4px; box-shadow:0 4px 0 var(--ink); }
  .seg button { font-family:var(--display); font-weight:400; font-size:1.05rem; color:var(--ink); background:transparent; border:0; border-radius:999px; padding:6px 16px; }
  .seg button[aria-pressed="true"] { background:var(--lemon); }
  .effort-box { margin-bottom:16px; }
  .oauth { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-bottom:10px; font-size:1.05rem; }
  .oauth svg { width:20px; height:20px; flex:none; }
  .btn.oauth.google { background:#fff; }
  .btn.oauth.apple { background:#000; color:#fff; }
  .or { display:flex; align-items:center; gap:10px; color:var(--soft); font-size:.9rem; margin:2px 0 12px; }
  .or::before, .or::after { content:""; flex:1; height:2px; background:#e6e0ff; }
  .meta { display:inline-block; background:rgba(255,255,255,.65); border-radius:999px; padding:2px 10px; font-size:.85rem; margin:0 0 4px; }
  .love { background:rgba(255,255,255,.6); border-radius:14px; padding:10px 12px; }
  .love b { display:block; font-family:var(--display); font-weight:400; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* ===== MOMS theme: calm, warm, grown-up ===== */
  html[data-mode="mom"] {
    --ink:#3a2a25; --soft:#7d6b62; --accent:#c4533a; --accent-d:#a0402b; --line:#e8d9ca;
    --display:"Fraunces","Frank Ruhl Libre","Noto Serif JP","Noto Serif SC",Georgia,serif;
    --body:"DM Sans","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
  }
  html[data-mode="mom"] body { background-color:#fbf4ec; background-size:auto; background-attachment:fixed; font-weight:500;
    background-image:radial-gradient(circle at 0 0,#f8ddd0 0,transparent 42%),radial-gradient(circle at 100% 30%,#e3ebdb 0,transparent 38%); }
  html[data-mode="mom"] :focus-visible { outline-color:var(--accent); }
  html[data-mode="mom"] #decor span { opacity:.13; filter:none; }
  html[data-mode="mom"] .logo { font-weight:600; color:var(--accent); -webkit-text-stroke:0; text-shadow:none; transform:none; letter-spacing:-.01em; }
  html[data-mode="mom"] .langpick select { border:1.5px solid var(--line); box-shadow:none; font-weight:500; }
  html[data-mode="mom"] .userbar { border:1.5px solid var(--line); box-shadow:none; }
  html[data-mode="mom"] .bubble { border:1.5px solid var(--line); box-shadow:none; border-radius:18px; font-weight:500; font-size:1.02rem; }
  html[data-mode="mom"] .bubble::before { border-inline-start:1.5px solid var(--line); border-bottom:1.5px solid var(--line); }
  html[data-mode="mom"] .mascot-face { font-size:2.6rem; }
  html[data-mode="mom"] .card { border:1px solid var(--line); border-radius:24px; box-shadow:0 14px 34px rgba(120,70,40,.09); }
  html[data-mode="mom"] .card.inner { background:#fff9f3; box-shadow:none; }
  html[data-mode="mom"] .clock { background:#f7e6b5; border:0; font-weight:600; }
  html[data-mode="mom"] label.field { font-weight:600; }
  html[data-mode="mom"] h2, html[data-mode="mom"] h3 { font-weight:600; }
  html[data-mode="mom"] input, html[data-mode="mom"] textarea, html[data-mode="mom"] select.plain { background:#fffaf4; border:1.5px solid var(--line); border-radius:14px; font-weight:500; }
  html[data-mode="mom"] .card.inner input, html[data-mode="mom"] .card.inner textarea, html[data-mode="mom"] .card.inner select.plain { background:#fff; }
  html[data-mode="mom"] button { font-family:var(--body); font-weight:600; }
  html[data-mode="mom"] .btn { background:var(--accent); color:#fff; border:0; border-radius:999px; box-shadow:0 3px 0 var(--accent-d); }
  html[data-mode="mom"] .btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--accent-d); }
  html[data-mode="mom"] .btn.big { font-size:1.2rem; padding:15px; border:0; border-radius:999px; box-shadow:0 4px 0 var(--accent-d); }
  html[data-mode="mom"] .btn.big:active { transform:translateY(3px); box-shadow:0 1px 0 var(--accent-d); }
  html[data-mode="mom"] .btn.white { background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none; }
  html[data-mode="mom"] .btn.pink { background:#5f7f64; box-shadow:0 3px 0 #48634c; }
  html[data-mode="mom"] .btn.danger { background:#b3382c; box-shadow:0 3px 0 #8a2a21; }
  html[data-mode="mom"] .btn.on { background:#f7e6b5; color:var(--ink); }
  html[data-mode="mom"] .btn.small { padding:6px 14px; font-size:.9rem; border-width:0; box-shadow:none; }
  html[data-mode="mom"] .btn.small.white { border:1.5px solid var(--line); }
  html[data-mode="mom"] .btn.oauth.apple { background:#000; color:#fff; box-shadow:none; }
  html[data-mode="mom"] .btn.oauth.google { background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none; }
  html[data-mode="mom"] .or::before, html[data-mode="mom"] .or::after { background:var(--line); }
  html[data-mode="mom"] .chip { font-family:var(--body); font-weight:500; border:1.5px solid var(--line); box-shadow:none; }
  html[data-mode="mom"] .chip:nth-child(4n+1) { background:#fbe3d9; }
  html[data-mode="mom"] .chip:nth-child(4n+2) { background:#e4ecdc; }
  html[data-mode="mom"] .chip:nth-child(4n+3) { background:#f9ecc4; }
  html[data-mode="mom"] .chip:nth-child(4n+4) { background:#fff; }
  html[data-mode="mom"] .seg { border:1.5px solid var(--line); box-shadow:none; }
  html[data-mode="mom"] .seg button { font-family:var(--body); font-weight:600; font-size:.95rem; }
  html[data-mode="mom"] .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  html[data-mode="mom"] .tray { background:transparent; padding:0; gap:14px; border-radius:0; grid-template-columns:1fr; }
  html[data-mode="mom"] .bento, html[data-mode="mom"] .bento:nth-child(n) { background:#fff; border:1px solid var(--line); border-inline-start:6px solid var(--accent);
    border-radius:20px; box-shadow:0 10px 26px rgba(120,70,40,.08); animation:rise .5s ease both; }
  html[data-mode="mom"] .bento:nth-child(2) { border-inline-start-color:#7a9a7e; animation-delay:.1s; }
  html[data-mode="mom"] .bento:nth-child(3) { border-inline-start-color:#e0b44c; animation-delay:.2s; }
  html[data-mode="mom"] .bento .big-emoji { font-size:2.4rem; }
  html[data-mode="mom"] .bento h3 { font-size:1.4rem; padding-inline-end:76px; }
  html[data-mode="mom"] .bento .how b { font-family:var(--body); font-weight:600; font-size:.95rem; color:var(--accent); }
  html[data-mode="mom"] .price { background:#f7e6b5; border:0; transform:none; box-shadow:none; top:14px; inset-inline-end:14px; font-family:var(--body); font-weight:600; font-size:.95rem; }
  html[data-mode="mom"] .meta { background:#eef2e8; font-weight:600; }
  html[data-mode="mom"] .love { background:#fdeee6; font-style:italic; font-family:var(--display); }
  html[data-mode="mom"] .love b { font-family:var(--body); font-style:normal; font-weight:600; font-size:.9rem; color:var(--accent); }
  html[data-mode="mom"] .thinking { background:#fdeee6; color:var(--ink); font-family:var(--display); font-weight:600; font-size:1.2rem; }
  html[data-mode="mom"] th { background:#f6ede3; }
  html[data-mode="mom"] th, html[data-mode="mom"] td { border-bottom-color:var(--line); }
  html[data-mode="mom"] .badge { border-width:1px; }
  .chip.sel { background:var(--lemon) !important; }
  html[data-mode="mom"] .chip.sel { background:var(--accent) !important; color:#fff; border-color:var(--accent); }
  a.btn { display:inline-block; text-align:center; text-decoration:none; color:var(--ink); }
  .recipe-link { display:inline-block; margin-top:8px; font-family:var(--display); color:var(--ink); background:#fff; border:2.5px solid var(--ink);
    border-radius:12px; padding:6px 14px; text-decoration:none; box-shadow:0 3px 0 var(--ink); }
  html[data-mode="mom"] .recipe-link { font-family:var(--body); font-weight:600; color:var(--accent); border:1.5px solid var(--accent); border-radius:999px; box-shadow:none; }
  .recipe-emoji { font-size:3rem; line-height:1; display:block; margin-bottom:6px; }
  .recipe-meta { margin:0 0 10px; }
  #recipeView h3 { margin-top:18px; }
  #recipeView ul, #recipeView ol { margin:0; padding-inline-start:1.4rem; line-height:1.55; }
  #recipeView li { margin-bottom:6px; }
  #recipeView .row { margin-top:14px; }
  @media print {
    #decor, header .langpick, .modebar, .noprint { display:none !important; }
    body { background:#fff !important; padding:0; }
    .card { box-shadow:none !important; border:0 !important; }
  }
  .dietbox { margin-bottom:16px; }
  .dietbox label.field { font-size:1.1rem; margin-bottom:8px; }
  html[data-mode="mom"] .dietbox label.field { font-size:1.1rem; }
  .dietbox input { margin-bottom:8px; }
  .dietbox .chips { margin-bottom:4px; }
  .dietbox .notice { margin-top:4px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="decor" aria-hidden="true"></div>

<div class="wrap" id="wrap">
  <header>
    <h1 class="logo"><span class="logo-emoji" id="logoEmoji" aria-hidden="true">🍕</span><span id="t-title"></span></h1>
    <label class="langpick">
      <span class="sr">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="he">עברית</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
    </label>
  </header>

  <div class="modebar">
    <div class="seg" id="modebar" role="group">
      <button type="button" id="modeKid" aria-pressed="true"></button>
      <button type="button" id="modeMom" aria-pressed="false"></button>
    </div>
  </div>

  <div class="userbar" id="userbar" hidden>
    <span id="who"></span>
    <button class="btn small pink" id="adminBtn" hidden>Admin</button>
    <button class="btn small white" id="outBtn"></button>
  </div>

  <div class="mascot" id="mascot" hidden>
    <span class="mascot-face" id="mascotFace" aria-hidden="true">🧑‍🍳</span>
    <div class="bubble" id="t-sub"></div>
  </div>

  <!-- sign in -->
  <section id="authView" hidden>

/* ---------- auth ---------- */
function authMessage(text, isError) {
  const m = $("authMsg");
  m.textContent = text || "";
  m.className = "notice " + (isError ? "error" : "ok");
}

function friendlyAuthError(error) {
  const L = S();
  const code = error.code || "";
  const msg = String(error.message || "");
  if (code === "email_not_confirmed" || /not confirmed/i.test(msg)) { $("btnResend").hidden = false; return L.unconfirmed; }
  if (code === "over_email_send_rate_limit" || error.status === 429) return /after \d+ seconds/i.test(msg) ? L.wait : L.mailLimit;
  if (code === "invalid_credentials" || /invalid login/i.test(msg)) return L.badLogin;
  return msg;
}

// Supabase sends one email per minute, and every new email kills the older link.
// So after sending we lock Join / Resend for a minute (no more "tap Join again" pile-ups).
let authLockTimer = null;
function lockAuth(seconds) {
  clearInterval(authLockTimer);
  let left = seconds;
  const paint = () => {
    const locked = left > 0;
    $("btnSignup").disabled = locked;
    $("btnResend").disabled = locked;
    $("btnResend").textContent = S().resend + (locked ? " (" + left + ")" : "");
  };
  paint();
  authLockTimer = setInterval(() => { left--; paint(); if (left <= 0) clearInterval(authLockTimer); }, 1000);
}

$("btnSignin").addEventListener("click", async () => {
  authMessage("");
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) { authMessage(S().fill, true); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) authMessage(friendlyAuthError(error), true);
});
$("btnSignup").addEventListener("click", async () => {
  const L = S();
  authMessage("");
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) { authMessage(L.fill, true); return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { authMessage(friendlyAuthError(error), true); return; }
  // Supabase hides "already registered" by returning a user with no identities
  if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) { authMessage(L.exists, true); return; }
  if (!data.session) {
    authMessage(L.confirm, false);
    $("btnResend").hidden = false;
    lockAuth(60);
  }
});
$("btnResend").addEventListener("click", async () => {
  const L = S();
  const email = $("email").value.trim();
  if (!email) { authMessage(L.fill, true); return; }
  authMessage("");
  const { error } = await sb.auth.resend({ type: "signup", email });
  if (error) { authMessage(friendlyAuthError(error), true); return; }
  authMessage(L.resent, false);
  lockAuth(60);
});

// Back from an old email link or a failed social sign-in: Supabase redirects with error_code in # or ?.
(function oldLink() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const q = new URLSearchParams(location.search);
  const code = h.get("error_code") || q.get("error_code");
  if (!code) return;
  const desc = h.get("error_description") || q.get("error_description") || code;
  ["error", "error_code", "error_description"].forEach(k => q.delete(k));
  history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
  if (code === "otp_expired") { $("btnResend").hidden = false; authMessage(S().unconfirmed, true); }
  else authMessage(S().oauthErr + desc, true);
})();

}

/* ---------- live ban status (Realtime + a safety-net check) ---------- */
let banChannel = null, banPoll = null;

function applyBanState(banned, reason) {
  const inBannedView = !$("bannedView").hidden;
  if (banned) {
    $("adminBtn").hidden = true;
    showBanned(reason);
  } else if (inBannedView) {
    $("adminBtn").hidden = !isAdmin;
    show("appView");
  }
}

async function checkBan() {
  if (!currentUserId) return;
  const { data } = await sb.from("app_users").select("banned, ban_reason").eq("id", currentUserId).maybeSingle();
  if (data) applyBanState(data.banned, data.ban_reason);
}

function stopWatching() {
  if (banChannel) { sb.removeChannel(banChannel); banChannel = null; }
  if (banPoll) { clearInterval(banPoll); banPoll = null; }
}

function watchBan(userId) {
  stopWatching();
  banChannel = sb.channel("ban-" + userId)
    .on("postgres_changes",
        { event: "UPDATE", schema: "public", table: "app_users", filter: "id=eq." + userId },
        p => applyBanState(p.new.banned, p.new.ban_reason))
    .subscribe();
  banPoll = setInterval(checkBan, 20000); // in case the live connection drops
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkBan(); });

async function enterApp(session) {
  if (!session) {
    stopWatching();
    currentUserId = null;
    currentEmail = null;
    isAdmin = false;
    $("userbar").hidden = true;
    $("adminBtn").hidden = true;
    show("authView");
    return;
  }
  currentUserId = session.user.id;
  currentEmail = session.user.email;
  paintWho();
  $("userbar").hidden = false;
  const { data, error } = await sb.rpc("touch_user");
  if (error) { show("authView"); authMessage(error.message, true); return; }
  watchBan(session.user.id);
  if (data && data.banned) { $("adminBtn").hidden = true; showBanned(data.reason); return; }
  const { data: adm } = await sb.rpc("is_admin");
  isAdmin = adm === true;
  $("adminBtn").hidden = !isAdmin;
  show("appView");
}

/* ---------- full recipes live in the URL (compressed when the browser can) ---------- */
const pageBase = () => location.href.split(/[?#]/)[0];
function b64u(bytes) {
  let t = ""; bytes.forEach(b => { t += String.fromCharCode(b); });
  return btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64u(t) {
  t = t.replace(/-/g, "+").replace(/_/g, "/");
  while (t.length % 4) t += "=";
  return Uint8Array.from(atob(t), c => c.charCodeAt(0));
}
async function pipeBytes(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function packRecipe(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  try { if (window.CompressionStream) return "z" + b64u(await pipeBytes(raw, new CompressionStream("deflate-raw"))); } catch (e) {}
  return "p" + b64u(raw);
}
async function unpackRecipe(tok) {
  let bytes = unb64u(tok.slice(1));
  if (tok[0] === "z") bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
  else if (tok[0] !== "p") throw new Error("bad token");
  return JSON.parse(new TextDecoder().decode(bytes));
}
// the URL is untrusted input: keep only the fields we expect, cut to sane sizes
function cleanLoaded(p) {
  if (!p || typeof p !== "object" || !p.r || !Array.isArray(p.r.ingredients) || !Array.isArray(p.r.steps)) return null;
  const str = (x, n) => String(x == null ? "" : x).slice(0, n);
  return { n: str(p.n, 120), e: firstEmoji(p.e), l: LANGS[p.l] ? p.l : "en", m: p.m === "mom" ? "mom" : "kid",
    r: { servings: Number(p.r.servings) || 0, total_minutes: Number(p.r.total_minutes) || 0,
         ingredients: p.r.ingredients.slice(0, 30).map(x => str(x, 200)),
         steps: p.r.steps.slice(0, 30).map(x => str(x, 600)), tips: str(p.r.tips, 500) } };
}
function renderRecipe() {
  const L = S(), v = $("recipeView"), d = recipeData;
  v.replaceChildren();
  const card = el("div", "card");
  if (!d) {
    card.append(el("h2", null, "🍽️"), el("p", "error", L.badRecipe));
  } else {
    card.append(el("span", "recipe-emoji", d.e), el("h2", null, d.n));
    const meta = el("p", "recipe-meta");
    if (d.r.servings) meta.append(el("span", "meta", "🍽 " + L.serves + ": " + d.r.servings), document.createTextNode(" "));
    if (d.r.total_minutes) meta.append(el("span", "meta", "⏱ " + d.r.total_minutes + " " + (L.min || "min")));
    card.append(meta);
    card.append(el("h3", null, "🛒 " + L.ingr));
    const ul = el("ul"); d.r.ingredients.forEach(x => ul.append(el("li", null, x))); card.append(ul);
    card.append(el("h3", null, "🍳 " + L.stepsH));
    const ol = el("ol"); d.r.steps.forEach(x => ol.append(el("li", null, x))); card.append(ol);
    if (d.r.tips) card.append(el("h3", null, "💡 " + L.tipsH), el("p", null, d.r.tips));
    card.append(el("p", "notice", L.dietNote));
  }
  const row = el("div", "row noprint");
  if (d) { const pb = el("button", "btn", "🖨 " + L.print); pb.type = "button"; pb.onclick = () => window.print(); row.append(pb); }
  const home = el("a", "btn white", "← " + L.home); home.href = pageBase();
  row.append(home);
  card.append(row);
  v.append(card);
}

/* ---------- results: the bento lunchbox ---------- */
function confetti() {
  if (reduceMotion) return;
  const set = mode === "mom" ? ["💛","🌿","✨","🍋"] : ["🎉","⭐","🍕","🍓","🍪","✨","🥨","🍉"];
  for (let i = 0; i < (mode === "mom" ? 12 : 22); i++) {
    const s = el("span", "confetti", set[i % set.length]);
    s.style.left = (Math.random() * 100) + "vw";
    s.style.fontSize = (18 + Math.random() * 16) + "px";
    s.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    document.body.append(s);
    setTimeout(() => s.remove(), 3600);
  }
}

function firstEmoji(v) {
  const chars = Array.from(String(v || "").trim());
  return chars.length && chars.length <= 4 ? chars.join("") : "🍽️";
}

function renderResult(out, parsed) {
  const L = S();
  out.replaceChildren();
  if (parsed.greeting) out.append(el("div", "bubble says", parsed.greeting));
  if (parsed.common_thread) out.append(el("div", "bubble says", (mode === "mom" ? "💛 " : "🔎 ") + parsed.common_thread));

  const tray = el("div", "tray");
  (parsed.suggestions || []).forEach(s => {
    const box = el("div", "bento");
    box.append(el("span", "price", s.approx_price_usd || L.budget));
    box.append(el("span", "big-emoji", firstEmoji(s.emoji)));
    box.append(el("h3", null, s.name || ""));
    const mins = Number(s.time_minutes);
    if (mins > 0 && mins < 600) box.append(el("span", "meta", "⏱ " + Math.round(mins) + " " + (L.min || "min")));
    box.append(el("p", null, s.why_similar || ""));
    const how = el("p", "how");
    how.append(el("b", null, (mode === "mom" ? "🍳 " : "👩‍🍳 ") + L.easy), document.createTextNode(s.how_to_get || ""));
    box.append(how);
    if (s.full_recipe && Array.isArray(s.full_recipe.steps) && s.full_recipe.steps.length) {
      const a = el("a", "recipe-link", "📖 " + (L.fullRecipe || "Full recipe"));
      a.target = "_blank"; a.rel = "noopener"; a.href = "#";
      const snap = mode;
      packRecipe({ v: 1, n: s.name || "", e: firstEmoji(s.emoji), l: lang, m: snap, r: s.full_recipe })
        .then(t => { a.href = pageBase() + "?mode=" + snap + "&recipe=" + t; });
      box.append(a);
    }
    if (s.love_touch) {
      const love = el("p", "love");
      love.append(el("b", null, "💌 " + (L.love || "")), document.createTextNode(s.love_touch));
      box.append(love);
    }
    tray.append(box);
  });
  out.append(tray);
  confetti();
  tray.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
}

function thinkingCard(text) {
  const c = el("div", "thinking");
  c.append(el("span", "pan", "🍳"), document.createTextNode(text));
  return c;
}

async function go() {
  const L = S();
  const seq = reqSeq;
  const out = $("result");
  const foods = $("foods").value.trim().slice(0, 300);
  out.replaceChildren();
  if (!foods) { out.append(el("p", "bubble says error", L.empty)); return; }

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show("authView"); return; }

  const face = $("mascotFace");
  if (!reduceMotion) { face.classList.remove("wiggle"); void face.offsetWidth; face.classList.add("wiggle"); }

  const now = new Date();
  const timeStr = now.toLocaleString("en-US", { weekday:"long", hour:"numeric", minute:"2-digit", hour12:true }) + " (hour " + now.getHours() + ")";

  const btn = $("go");
  btn.disabled = true;
  btn.textContent = L.loading;
  out.append(thinkingCard(L.loading));
  try {
    const res = await fetch(SUPABASE_URL + "/functions/v1/food-ai", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ foods, lang, local_time: timeStr, mode, effort, diet: $("diet").value.trim().slice(0, 200) })
    });
    const data = await res.json().catch(() => ({}));
    if (seq !== reqSeq) return; // the person switched mode meanwhile
    if (res.status === 403 && data.error === "banned") { showBanned(data.reason); return; }
    if (res.status === 401) { await sb.auth.signOut(); return; }
    if (res.status === 429) { out.replaceChildren(el("p", "bubble says error", L.rate)); return; }
    if (!res.ok) throw new Error(data.error || res.status);
    renderResult(out, data.result || {});
  } catch (e) {
    if (seq !== reqSeq) return;
    out.replaceChildren(el("p", "bubble says error", L.err + e.message + ". " + L.retry));
  } finally {
    btn.disabled = false;
    btn.textContent = S().go;
  }
}
$("go").addEventListener("click", go);
$("foods").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) go(); });

/* ====================== ADMIN PANEL ====================== */
let adminTab = "requests";

function renderAdmin() {
  const v = $("adminView");
  v.replaceChildren();
  const bar = el("div", "tabs");
  [["requests", "Requests"], ["users", "Users"], ["rules", "AI control"]].forEach(([k, label]) => {
    const b = el("button", "btn small white" + (adminTab === k ? " on" : ""), label);
    b.onclick = () => { adminTab = k; renderAdmin(); };
    bar.append(b);
  });
  const back = el("button", "btn small pink", "← Back to app");
  back.onclick = () => show("appView");
  bar.append(back);
  v.append(bar);
  const body = el("div", "card");
  v.append(body);
  if (adminTab === "requests") loadRequests(body);
  else if (adminTab === "users") loadUsers(body);
  else loadRules(body);
}

async function banUser(email, banned) {
  let why = null;
  if (banned) {
    why = prompt("Ban " + email + "?\nReason (shown to the user, optional):", "");
    if (why === null) return;
  }
  const { error } = await sb.rpc("admin_set_ban", { target_email: email, do_ban: banned, why });
  if (error) { alert(error.message); return; }
  renderAdmin();
}

function fmt(ts) { return ts ? new Date(ts).toLocaleString() : ""; }

async function loadRequests(body) {
  body.append(el("p", "muted", "Loading..."));
  const [{ data, error }, { data: bans }] = await Promise.all([
    sb.from("requests").select("*").order("created_at", { ascending: false }).limit(300),
    sb.from("bans").select("email")
  ]);
  body.replaceChildren();
  if (error) { body.append(el("p", "error", error.message)); return; }
  const bannedSet = new Set((bans || []).map(b => b.email));

  const search = document.createElement("input");
  search.placeholder = "Filter by email or food...";
  const wrap = el("div", "tablewrap");
  const draw = () => {
    const q = search.value.toLowerCase();
    wrap.replaceChildren();
    const rows = data.filter(r => !q || r.email.toLowerCase().includes(q) || r.foods.toLowerCase().includes(q));
    const t = document.createElement("table");
    const head = document.createElement("tr");
    ["When", "Mode", "Email", "Foods typed", "AI response", "Source", ""].forEach(h => head.append(el("th", null, h)));
    t.append(head);
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.append(el("td", null, fmt(r.created_at)));
      tr.append(el("td", null, r.mode === "mom" ? "💛 mom" : "🧒 kid"));
      tr.append(el("td", null, r.email));
      const ft = el("td", null, r.foods);
      if (r.diet) ft.append(el("br"), el("span", "badge", "diet: " + r.diet));
      tr.append(ft);
      const resp = el("td");
      const names = ((r.response && r.response.suggestions) || []).map(s => s.name).join(", ") || "(empty)";
      const d = el("details");
      d.append(el("summary", null, names), el("pre", null, JSON.stringify(r.response, null, 2)));
      resp.append(d);
      tr.append(resp);
      const src = el("td");
      src.append(el("span", "badge" + (r.source === "admin_override" ? " override" : ""), r.source === "admin_override" ? "your override" : (r.model || "ai")));
      tr.append(src);
      const act = el("td");
      const isBanned = bannedSet.has(r.email);
      if (isBanned) act.append(el("span", "badge banned", "banned"), document.createTextNode(" "));
      const b = el("button", "btn small " + (isBanned ? "white" : "danger"), isBanned ? "Unban" : "Ban");
      b.onclick = () => banUser(r.email, !isBanned);
      act.append(b);
      tr.append(act);
      t.append(tr);
    });
    wrap.append(t);
    if (!rows.length) wrap.append(el("p", "muted", "No requests yet."));
  };
  search.oninput = draw;
  body.append(el("p", "muted", "Latest " + data.length + " requests."), search, wrap);
  draw();
}

async function loadUsers(body) {
  body.append(el("p", "muted", "Loading..."));
  const { data, error } = await sb.rpc("admin_users");
  body.replaceChildren();
  if (error) { body.append(el("p", "error", error.message)); return; }
  const wrap = el("div", "tablewrap");
  const t = document.createElement("table");
  const head = document.createElement("tr");
  ["Email", "First seen", "Last seen", "Requests", "Status", ""].forEach(h => head.append(el("th", null, h)));
  t.append(head);
  (data || []).forEach(u => {
    const tr = document.createElement("tr");
    tr.append(el("td", null, u.u_email));
    tr.append(el("td", null, fmt(u.u_first)));
    tr.append(el("td", null, fmt(u.u_last)));
    tr.append(el("td", null, String(u.u_requests)));
    const st = el("td");
    st.append(el("span", "badge " + (u.u_banned ? "banned" : "active"), u.u_banned ? "banned" : "active"));
    if (u.u_banned && u.u_reason) st.append(document.createTextNode(" " + u.u_reason));
    tr.append(st);
    const act = el("td");
    const b = el("button", "btn small " + (u.u_banned ? "white" : "danger"), u.u_banned ? "Unban" : "Ban");
    b.onclick = () => banUser(u.u_email, !u.u_banned);
    act.append(b);
    tr.append(act);
    t.append(tr);
  });
  wrap.append(t);
  body.append(el("p", "muted", (data || []).length + " users."), wrap);
}

async function loadRules(body) {
  body.append(el("p", "muted", "Loading..."));
  const { data, error } = await sb.from("ai_overrides").select("*").order("created_at", { ascending: false });
  body.replaceChildren();
  if (error) { body.append(el("p", "error", error.message)); return; }

  body.append(el("p", "muted",
    "Rules run before the AI is called. 'Fixed response' replies with exactly what you write (not translated). " +
    "'Extra instruction' is added secretly to the AI's prompt. Leave email/keyword blank to match everyone."));
  body.append(ruleForm(() => renderAdmin()));

  const wrap = el("div", "tablewrap");
  const t = document.createElement("table");
  const head = document.createElement("tr");
  ["Type", "Email", "Keyword", "Content", "Status", ""].forEach(h => head.append(el("th", null, h)));
  t.append(head);
  (data || []).forEach(r => {
    const tr = document.createElement("tr");
    tr.append(el("td", null, r.mode === "response" ? "Fixed response" : "Instruction"));
    tr.append(el("td", null, r.target_email || "everyone"));
    tr.append(el("td", null, r.keyword || "any"));
    const summary = r.mode === "instruction"
      ? r.instruction
      : ((r.response && r.response.suggestions) || []).map(s => s.name).join(", ");
    tr.append(el("td", null, summary));
    const st = el("td");
    const tog = el("button", "btn small white", r.active ? "On (turn off)" : "Off (turn on)");
    tog.onclick = async () => {
      const { error: e } = await sb.from("ai_overrides").update({ active: !r.active }).eq("id", r.id);
      if (e) alert(e.message); else renderAdmin();
    };
    st.append(tog);
    tr.append(st);
    const act = el("td");
    const del = el("button", "btn small danger", "Delete");
    del.onclick = async () => {
      if (!confirm("Delete this rule?")) return;
      const { error: e } = await sb.from("ai_overrides").delete().eq("id", r.id);
      if (e) alert(e.message); else renderAdmin();
    };
    act.append(del);
    tr.append(act);
    t.append(tr);
  });
  wrap.append(t);
  body.append(wrap);
}

function ruleForm(done) {
  const f = el("div", "card inner");
  f.append(el("h3", null, "New rule"));
  const mk = (tag, ph) => { const n = document.createElement(tag); if (ph) n.placeholder = ph; return n; };

  const mode = document.createElement("select");
  mode.className = "plain";
  [["response", "Fixed response: reply with exactly what I write"],
   ["instruction", "Extra instruction: secretly steer the AI's prompt"]].forEach(([v, t]) => {
    const o = el("option", null, t); o.value = v; mode.append(o);
  });
  const target = mk("input", "Only for this email (blank = everyone)");
  const kw = mk("input", "Only when the foods contain... (blank = any)");

  const instrBox = el("div");
  const instr = mk("textarea", "e.g. Always suggest a vegetarian option first.");
  instrBox.append(instr);

  const respBox = el("div");
  const greet = mk("input", "Greeting line");
  respBox.append(greet);
  const rows = [0, 1, 2].map(i => {
    const g = el("div", "sugg");
    const n = mk("input", "Dish " + (i + 1) + " name");
    const e = mk("input", "Emoji, e.g. 🍕");
    const w = mk("input", "Why it's similar");
    const h = mk("input", "How to get it");
    const p = mk("input", "Price, e.g. $6");
    const t = mk("input", "Minutes (optional, shown in Moms mode), e.g. 20");
    const l = mk("input", "Love note (optional, shown in Moms mode)");
    g.append(n, e, w, h, p, t, l);
    respBox.append(g);
    return { n, e, w, h, p, t, l };
  });

  const sync = () => { instrBox.hidden = mode.value !== "instruction"; respBox.hidden = mode.value !== "response"; };
  mode.onchange = sync;
  sync();

  const msg = el("p", "error");
  const save = el("button", "btn", "Save rule");
  save.onclick = async () => {
    msg.textContent = "";
    const row = {
      mode: mode.value,
      target_email: target.value.trim().toLowerCase() || null,
      keyword: kw.value.trim() || null
    };
    if (mode.value === "instruction") {
      if (!instr.value.trim()) { msg.textContent = "Write the instruction."; return; }
      row.instruction = instr.value.trim();
    } else {
      const suggestions = rows.filter(r => r.n.value.trim()).map(r => ({
        name: r.n.value.trim(), emoji: r.e.value.trim(), why_similar: r.w.value.trim(),
        how_to_get: r.h.value.trim(), approx_price_usd: r.p.value.trim(),
        time_minutes: Number(r.t.value) || undefined, love_touch: r.l.value.trim() || undefined
      }));
      if (!suggestions.length) { msg.textContent = "Add at least one dish."; return; }
      row.response = { greeting: greet.value.trim(), suggestions };
    }
    const { error } = await sb.from("ai_overrides").insert(row);
    if (error) { msg.textContent = error.message; return; }
    done();
  };
  f.append(mode, target, kw, instrBox, respBox, save, msg);
  return f;
}

/* ---------- start ---------- */
if (RECIPE_TOKEN) {
  // a shared recipe link: no sign-in needed, everything is in the URL
  (async () => {
    try { if (RECIPE_TOKEN.length > 40000) throw new Error("too long"); recipeData = cleanLoaded(await unpackRecipe(RECIPE_TOKEN)); }
    catch (e) { recipeData = null; }
    if (recipeData) { lang = recipeData.l; mode = recipeData.m; }
    applyMode();
    show("recipeView");
    renderRecipe();
  })();
} else {
applyMode();
sb.auth.onAuthStateChange((event, session) => {
  // don't await supabase calls inside this callback; defer them
  if (event === "INITIAL_SESSION" || event === "SIGNED_IN") {
    if (session && session.user.id === currentUserId) return;
    setTimeout(() => enterApp(session), 0);
  } else if (event === "SIGNED_OUT") {
    setTimeout(() => enterApp(null), 0);
  }
});
}
